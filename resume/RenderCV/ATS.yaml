cv:
  name: Sebastián López Osorno
  location: Medellín, Antioquia, Colombia
  email: sebastianlopezosorno2005@gmail.com
  phone: +57 300 2329213
  website: https://sebastianlopezo.page/
  social_networks:
    - network: LinkedIn
      username: sebastianlopezosorno
    - network: GitHub
      username: SebastianLopezO

  sections:
    resumen_profesional:
      - Desarrollador Backend y de Integraciones con más de 4 años de experiencia en desarrollo backend, automatización de CRM (Zoho) y analítica de datos, cursando el último semestre de Ingeniería Informática. Lidero más de 20 servicios de integración en FastAPI que conectan Zoho CRM con los sistemas académicos de más de 15 clientes educativos de Latinoamérica y España. Impulsado por una curiosidad insaciable, me apasiona la tecnología como motor para la transformación educativa y empresarial.

    experiencia:
      - company: TIVENOS - Solutions for Education
        position: IT Manager & Líder de Integraciones Backend
        location: Remoto
        start_date: 2025-06
        end_date: present
        highlights:
          - Lidero más de 20 servicios de integración en **FastAPI** (Python, PostgreSQL) que sincronizan **Zoho CRM** con los sistemas académicos de más de 15 clientes educativos.
          - Integro sistemas externos mediante REST, SOAP/WS-Security (Zeep), SQL Server y FTP, usando OAuth y la Bulk API de Zoho.
          - Publico imágenes Docker endurecidas en **GHCR** y las despliego con Docker Compose y **GitHub Actions** en servidores Linux con Nginx.
          - Construí un stack de observabilidad con **Prometheus, Grafana, Loki y Tempo**, con alertas a Telegram.
          - Desarrollo widgets de Zoho CRM, formularios de admisión y tableros en **Zoho Analytics** con SQL.

      - company: ADCOM GROUP
        position: Desarrollador CRM & MarTech
        location: Medellín, Colombia (Híbrido/Remoto)
        start_date: 2025-02
        end_date: present
        highlights:
          - Configuro módulos, flujos y funciones en **Zoho CRM (Deluge)** y aplicaciones internas en **Zoho Creator**.
          - Construí más de 100 landing pages y micrositios de admisiones conectados a Zoho Forms y Zoho CRM.
          - Integro WhatsApp, Meta Ads, Google Ads y Shopify vía API REST, y automaticé el contacto de leads con IA en **Dapta**.
          - Desarrollé APIs de resultados y un generador de plantillas HTML con **Java Spring Boot y Thymeleaf** para marcas nacionales de lotería.
          - Administro un VPS con Docker, Nginx, SSL, Prometheus, Nagios y n8n.

      - company: MUV-U S.A.S
        position: Desarrollador Backend & Analista de Datos
        location: Sabaneta, Colombia
        start_date: 2023-07
        end_date: 2025-01
        highlights:
          - Construí informes ejecutivos en **Power BI** (DAX) para las áreas financiera, comercial y de mercadeo.
          - Diseñé la arquitectura de datos del CRM y automaticé procesos operativos.
          - Administré la infraestructura de servidores y brindé soporte TI.

      - company: Quipux S.A.S
        position: Analista de Datos (Práctica)
        location: Medellín, Colombia
        start_date: 2022-08
        end_date: 2023-05
        highlights:
          - Construí procesos ETL y de limpieza de datos con Python y SQL para reportes de recaudo y movilidad.
          - Desarrollé informes de visualización interactivos para la toma de decisiones.

    educación:
      - institution: Politécnico Colombiano Jaime Isaza Cadavid
        area: Ingeniería Informática
        degree: Pregrado
        location: Medellín, Colombia
        start_date: 2022-01
        end_date: 2026-12
        highlights:
          - Último semestre; ceremonia de grado en marzo de 2027.
          - Formación en ciencias de la computación, ingeniería de software, arquitectura de hardware e IA.
          - Proyectos en Java, Python, MongoDB, Spring Boot, Docker, React e IoT sobre ESP32.

      - institution: SENA – IUSH
        area: Programación de Software
        degree: Técnico
        location: Medellín, Colombia
        start_date: 2022-01
        end_date: 2023-06
        highlights:
          - Enfoque práctico en desarrollo web, bases de datos, control de versiones (Git) y programación funcional.

    proyectos:
      - name: SmartPotTech (IoT & Agricultura)
        start_date: 2024-09
        end_date: present
        summary: Plataforma IoT para monitorear y automatizar cultivos hidropónicos (desarrollador líder, organización de 5 miembros).
        highlights:
          - ESP32 con MicroPython y MQTT sobre TLS, API en **Spring Boot 4** (Java 21) con MongoDB y Redis, servicio de IA con FastAPI y scikit-learn, y PWA en **React 19 + TypeScript**.
          - Imágenes en GHCR y despliegue serializado con Docker Compose y GitHub Actions.

      - name: GoPoli (Movilidad universitaria)
        start_date: 2026-03
        end_date: present
        summary: Plataforma de viajes compartidos para estudiantes del Politécnico (principal contribuidor).
        highlights:
          - PWA en **Next.js** con Leaflet y OSRM, API REST en **Spring Boot 4** con JWT y base de datos PostgreSQL 16.

      - name: PepperCRM
        start_date: 2025-02
        end_date: 2025-11
        summary: Producto CRM construido por un equipo de cuatro.
        highlights:
          - Backend en **Spring Boot** con Spring Security y JWT, MongoDB Atlas, Redis y Swagger.

      - name: Repositorios Académicos (EngineeringSebastian-s)
        date: 2022
        summary: Colección de proyectos de ingeniería.
        highlights:
          - Implementaciones de estructuras de datos (árboles, grafos), inteligencia artificial, visión por computador y sistemas operativos usando Java, Python y C++.

    habilidades:
      - label: Lenguajes de Programación
        details: Python, Java, C++, PHP, JavaScript, TypeScript, Zoho Deluge, SQL.
      - label: Backend & Frameworks
        details: FastAPI, Django, Spring Boot, Laravel, Node.js, Next.js.
      - label: CRM & Automatización
        details: Zoho CRM, Zoho Creator, Zoho Analytics, Zoho Forms, n8n, Zapier, Dapta.
      - label: Data & Analytics
        details: Power BI (DAX), Pandas, NumPy, Tableau, Zoho Analytics.
      - label: DevOps & Herramientas
        details: Docker, Docker Compose, GitHub Actions, GHCR, Nginx, Linux, Prometheus, Grafana, AWS.
      - label: Idiomas
        details: Español (Nativo), Inglés (Competencia profesional completa).

    certificaciones:
