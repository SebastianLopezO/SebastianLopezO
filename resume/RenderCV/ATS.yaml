      - bullet: "**Green Digital Skills Certificate** | INCO Academy (2024)"
      - bullet: "**Ciencia de Datos e Inteligencia Artificial** | Universidad de Antioquia (2023)"
      - bullet: "**Ruta de Data Analyst (Power BI, Excel Avanzado, SQL)** | Platzi"
