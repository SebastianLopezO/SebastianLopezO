        uses: lowlighter/metrics@v3.34
        with:
          template: repository
          filename: metrics/repos/smartpot-iot.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: SmartPotTech
          repo: SmartPot-IoT
          plugin_lines: yes
          plugin_followup: yes

      # =============================
      # 🔁 SmartPot-Proxy
      # =============================
      - name: SmartPot-Proxy
        uses: lowlighter/metrics@v3.34
        with:
          template: repository
          filename: metrics/repos/smartpot-proxy.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: SmartPotTech
          repo: SmartPot-Proxy
          plugin_lines: yes
          plugin_followup: yes

      # =============================
      # 📦 SmartPot-Mail
      # =============================
      - name: SmartPot-Mail
        uses: lowlighter/metrics@v3.34
        with:
          template: repository
          filename: metrics/repos/smartpot-mail.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: SmartPotTech
          repo: SmartPot-Mail
          plugin_lines: yes
          plugin_followup: yes

      # =============================
      # ⚡ SmartPot-Cache
      # =============================
      - name: SmartPot-Cache
        uses: lowlighter/metrics@v3.34
        with:
          template: repository
          filename: metrics/repos/smartpot-cache.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: SmartPotTech
          repo: SmartPot-Cache
          plugin_lines: yes
          plugin_followup: yes

      # =============================
      # 📊 SmartPot-DataAnalytics
      # =============================
      - name: SmartPot-DataAnalytics
        uses: lowlighter/metrics@v3.34
        with:
          template: repository
          filename: metrics/repos/smartpot-dataanalytics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: SmartPotTech
          repo: SmartPot-DataAnalytics
          plugin_lines: yes
          plugin_followup: yes

      # =============================
      # 🧪 SmartPot-DataGenerator
      # =============================
      - name: SmartPot-DataGenerator
        uses: lowlighter/metrics@v3.34
        with:
          template: repository
          filename: metrics/repos/smartpot-datagenerator.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: SmartPotTech
