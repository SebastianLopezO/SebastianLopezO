name: Repository Metrics

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # =============================
      # 🌱 SmartPot-Web
      # =============================
      - name: SmartPot-Web
        uses: lowlighter/metrics@v3.34
        with:
          template: repository
          filename: metrics/repos/smartpot-web.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: SmartPotTech
          repo: SmartPot-Web
          plugin_lines: yes
          plugin_followup: yes

      # =============================
      # 🔌 SmartPot-API
      # =============================
      - name: SmartPot-API
        uses: lowlighter/metrics@v3.34
        with:
          template: repository
          filename: metrics/repos/smartpot-api.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: SmartPotTech
          repo: SmartPot-API
          plugin_lines: yes
          plugin_followup: yes

      # =============================
      # 🗄️ SmartPot-DB
      # =============================
      - name: SmartPot-DB
        uses: lowlighter/metrics@v3.34
        with:
          template: repository
          filename: metrics/repos/smartpot-db.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: SmartPotTech
          repo: SmartPot-DB
          plugin_lines: yes
          plugin_followup: yes

      # =============================
      # 🤖 SmartPot-IoT
      # =============================
